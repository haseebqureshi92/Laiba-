<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laiba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#05070f;
    --night:#0b0f22;
    --panel:#11162c;
    --panel2:#161c38;
    --gold:#f4c978;
    --warm:#ffe0ab;
    --peri:#9fb2ea;
    --plum:#c79fd0;
    --text:#f3efe4;
    --muted:#96a0c4;
    --line:rgba(244,201,120,0.22);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; background:var(--night-deep); font-family:'Outfit',sans-serif; color:var(--text); overflow-x:hidden; }

  /* ---------------- sky ---------------- */
  #sky{ position:fixed; inset:0; z-index:0; overflow:hidden; background:
      radial-gradient(ellipse at 20% 10%, rgba(159,178,234,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(199,159,208,0.10), transparent 55%),
      linear-gradient(180deg, var(--night-deep), var(--night) 55%, #070a17 100%);
  }
  .twinkle{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; opacity:.5;
    animation: tw 3.5s ease-in-out infinite; }
  @keyframes tw{ 0%,100%{ opacity:.15; transform:scale(1);} 50%{ opacity:1; transform:scale(1.6);} }
  .shooting{ position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    box-shadow: 0 0 6px 1px rgba(255,255,255,0.9);
    animation: shoot 1.4s linear forwards; }
  .shooting::before{ content:''; position:absolute; top:1px; right:1px; width:90px; height:1px;
    background: linear-gradient(90deg, rgba(255,255,255,0.9), transparent); transform-origin:right center; }
  @keyframes shoot{ 0%{ transform: translate(0,0); opacity:1; } 100%{ transform: translate(-260px,180px); opacity:0; } }

  .wrap{ position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }

  .card{
    width:100%; max-width:600px;
    background: linear-gradient(172deg, var(--panel2), var(--panel));
    border:1px solid var(--line);
    border-radius:24px;
    padding:34px 30px 32px;
    box-shadow: 0 50px 120px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative;
    min-height:460px;
  }

  /* ---------------- constellation progress ---------------- */
  .constellation-wrap{ margin-bottom:20px; }
  .constellation-label{ font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
  svg.constellation{ width:100%; height:104px; display:block; overflow:visible; }
  .cline{ stroke:rgba(255,255,255,0.12); stroke-width:1; }
  .cstar{ fill:rgba(255,255,255,0.25); transition: fill .6s ease, r .5s ease; }
  .cstar.lit{ fill:var(--gold); filter: drop-shadow(0 0 4px rgba(244,201,120,0.85)); }
  .cstar.north{ transition: fill .6s ease; }
  .cstar.north.lit{ fill:var(--warm); filter: drop-shadow(0 0 8px rgba(255,224,171,1)) drop-shadow(0 0 18px rgba(244,201,120,0.55));
    animation: northPulse 2.6s ease-in-out infinite; }
  @keyframes northPulse{ 0%,100%{ r:5.5; } 50%{ r:6.6; } }

  /* ---------------- intro / ignite star ---------------- */
  .intro-stage{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:8px; }
  .eyebrow{ font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; font-weight:500; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:32px; line-height:1.18; margin:0 0 14px 0; color:var(--text); }
  .lede{ font-size:14.5px; line-height:1.75; color:var(--muted); margin-bottom:8px; max-width:430px; }

  .ignite{ position:relative; width:120px; height:120px; margin:22px 0 20px; cursor:pointer; }
  .ignite .core{ position:absolute; top:50%; left:50%; width:14px; height:14px; margin:-7px 0 0 -7px;
    background: radial-gradient(circle, #fff, var(--gold) 60%, transparent 75%);
    border-radius:50%; box-shadow: 0 0 16px 4px rgba(244,201,120,0.55);
    transition: transform .5s cubic-bezier(.3,.8,.3,1), box-shadow .5s ease; }
  .ignite .ring{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(244,201,120,0.35);
    animation: ringspin 9s linear infinite; }
  .ignite .ring2{ position:absolute; inset:16px; border-radius:50%; border:1px dashed rgba(159,178,234,0.3);
    animation: ringspin 14s linear infinite reverse; }
  @keyframes ringspin{ to{ transform: rotate(360deg); } }
  .ignite.lit .core{ transform: scale(2.6); box-shadow: 0 0 40px 14px rgba(244,201,120,0.65); }
  .tap-hint{ font-size:12px; color:var(--muted); margin-top:2px; opacity:.75; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.35;} 50%{opacity:.9;} }

  /* ---------------- question flow ---------------- */
  .stage{ position:relative; }
  .qcard{ display:none; }
  .qcard.active{ display:block; animation: slideIn .55s cubic-bezier(.2,.8,.2,1); }
  @keyframes slideIn{ from{ opacity:0; transform:translateX(22px);} to{ opacity:1; transform:translateX(0);} }

  .qnum{ font-size:11px; letter-spacing:2px; color:var(--muted); margin-bottom:10px; text-transform:uppercase; }
  .qtext{ font-family:'Fraunces',serif; font-size:22.5px; font-weight:500; font-style:italic; margin-bottom:22px; line-height:1.4; color:var(--text); }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    text-align:left; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.09);
    color:var(--text); padding:14px 18px; border-radius:13px; font-family:'Outfit',sans-serif; font-size:14px;
    cursor:pointer; transition: all .22s ease; position:relative; overflow:hidden;
  }
  .opt::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--gold); transform:scaleY(0);
    transition: transform .25s ease; transform-origin:bottom; }
  .opt:hover{ border-color:var(--gold); background:rgba(244,201,120,0.07); transform:translateX(5px); }
  .opt:hover::before{ transform:scaleY(1); }

  textarea{
    width:100%; min-height:88px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1);
    border-radius:13px; color:var(--text); font-family:'Outfit',sans-serif; font-size:14px; padding:14px 16px;
    resize:vertical; outline:none; transition:border-color .25s ease;
  }
  textarea:focus{ border-color:var(--gold); }
  .go{
    margin-top:14px; background:linear-gradient(100deg,var(--gold),var(--plum)); border:none; color:#241407;
    padding:12px 22px; border-radius:12px; font-weight:500; font-size:13.5px; cursor:pointer;
    transition: transform .2s ease, box-shadow .2s ease; font-family:'Outfit',sans-serif;
  }
  .go:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(244,201,120,0.3); }

  /* ---------------- reveal ---------------- */
  .reveal{ display:none; text-align:center; }
  .reveal.active{ display:block; animation: unfold 1s cubic-bezier(.2,.8,.2,1); }
  @keyframes unfold{ from{ opacity:0; transform: translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  .reveal .tag{ font-family:'Fraunces',serif; font-style:italic; color:var(--peri); font-size:18px; display:block; margin-bottom:6px; }
  .reveal h1{ font-size:29px; margin-bottom:6px; }
  .datestamp{ font-size:11px; color:var(--muted); letter-spacing:1px; margin-bottom:20px; opacity:.7; }

  .typewriter{
    font-family:'Fraunces',serif; font-size:19px; font-style:italic; color:var(--gold);
    min-height:30px; margin-bottom:16px; text-align:left; border-right:2px solid var(--gold);
    display:inline-block; white-space:normal; overflow:hidden;
  }
  .typewriter.done{ border-right:none; }

  .letter{
    font-size:14.5px; line-height:1.9; color:var(--text); text-align:left;
    background:rgba(0,0,0,0.22); border-left:2px solid var(--gold); padding:22px 22px;
    border-radius:8px; margin-bottom:20px; min-height:20px;
  }
  .letter p{ margin:0 0 14px 0; opacity:0; }
  .letter p.show{ animation: lineIn .7s ease forwards; }
  .letter p:last-child{ margin-bottom:0; }
  @keyframes lineIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .letter .echo{ color:var(--gold); font-style:italic; }

  .signoff{ font-family:'Fraunces',serif; font-style:italic; font-size:17px; color:var(--gold); margin-top:16px; opacity:0; }
  .signoff.show{ animation: lineIn 1s ease forwards; }

  .react-wrap{ margin-top:28px; opacity:0; }
  .react-wrap.show{ animation: lineIn 1s ease forwards; }
  .react-btn{
    background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); color:var(--text);
    padding:12px 22px; border-radius:30px; font-size:13.5px; cursor:pointer; position:relative;
    transition: transform .2s ease, border-color .2s ease; font-family:'Outfit',sans-serif;
  }
  .react-btn:hover{ transform:translateY(-2px); border-color:var(--plum); }
  .react-btn.reacted{ border-color:var(--gold); color:var(--gold); }
  .burst{ position:absolute; pointer-events:none; font-size:14px; animation: burstUp 1s ease-out forwards; }
  @keyframes burstUp{ 0%{ opacity:1; transform: translate(0,0) scale(0.6);} 100%{ opacity:0; transform: translate(var(--bx), var(--by)) scale(1.3);} }

  .footnote{ margin-top:24px; font-size:11.5px; color:var(--muted); letter-spacing:.5px; opacity:.7; }

  .results-card .entry{ border-bottom:1px solid rgba(255,255,255,0.08); padding:14px 0; }
  .results-card .entry:last-child{ border-bottom:none; }
  .results-card .q{ font-size:12px; color:var(--muted); margin-bottom:4px; }
  .results-card .a{ font-family:'Fraunces',serif; font-size:18px; color:var(--gold); }
  .results-card .t{ font-size:11px; color:var(--muted); opacity:.6; margin-bottom:10px; }

  @media (max-width:480px){
    .card{ padding:28px 18px; }
    h1{ font-size:26px; }
    .qtext{ font-size:19px; }
  }
</style>
</head>
<body>

<div id="sky"></div>

<div class="wrap">
  <div class="card" id="mainCard">

    <div class="constellation-wrap">
      <div class="constellation-label">your sky, tonight</div>
      <svg class="constellation" id="conSvg"></svg>
    </div>

    <div class="stage" id="stage">

      <div class="qcard active" data-step="0">
        <div class="intro-stage">
          <span class="eyebrow">just for you</span>
          <h1>Hi Laiba.</h1>
          <p class="lede">A few honest questions, answered one star at a time — then something waiting for you at the end. Tap the star to begin.</p>
          <div class="ignite" id="ignite">
            <div class="ring"></div>
            <div class="ring2"></div>
            <div class="core"></div>
          </div>
          <div class="tap-hint">tap the star</div>
        </div>
      </div>

      <div class="reveal" data-step="final">
        <span class="tag">for Laiba</span>
        <h1>Here's what I wanted to say.</h1>
        <div class="datestamp" id="datestamp"></div>
        <div class="typewriter" id="typewriter"></div>
        <div class="letter" id="letterBox"></div>
        <div class="signoff" id="signoff">— under the same sky, thinking of you</div>
        <div class="react-wrap" id="reactWrap">
          <button class="react-btn" id="reactBtn" type="button">🤍 tap if this made you smile</button>
        </div>
        <div class="footnote">made slowly, and just for you.</div>
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var svgNS = 'http://www.w3.org/2000/svg';

  var questions = [
    {
      text: "When something good happens in your day, who do you usually want to tell first?",
      type: "choice",
      options: [
        "One of my closest friends",
        "Family, usually",
        "You come to mind more often than I'd admit"
      ]
    },
    {
      text: "How would you describe the way we talk, compared to your other friendships?",
      type: "choice",
      options: [
        "Easy — I don't have to try as hard",
        "Different somehow, in a good way",
        "It just feels more comfortable, honestly"
      ]
    },
    {
      text: "What's one small thing about us that you quietly look forward to?",
      type: "text",
      placeholder: "Could be anything, even something small..."
    },
    {
      text: "If you had a rough day, would I be someone you'd want to tell about it?",
      type: "choice",
      options: [
        "Probably, if I needed to talk",
        "Yes, you're someone I trust with that",
        "You're one of the first people I'd think of"
      ]
    },
    {
      text: "Out of the people you talk to regularly, where do you think I land?",
      type: "choice",
      options: [
        "Somewhere near the top",
        "Somewhere that's hard to explain",
        "Somewhere I don't usually say out loud"
      ]
    },
    {
      text: "Is there something about us you've thought about but never brought up?",
      type: "text",
      placeholder: "Say as much or as little as you want..."
    },
    {
      text: "When we haven't talked in a couple of days, how does that feel?",
      type: "choice",
      options: [
        "Normal, but I notice it",
        "Like something's missing from my day",
        "I usually end up reaching out first"
      ]
    },
    {
      text: "What's one word you'd use to describe how you feel around me?",
      type: "text",
      placeholder: "Just one word is fine"
    },
    {
      text: "If we spent a whole day together with nothing planned, how do you think it would feel?",
      type: "choice",
      options: [
        "Easy and fun, like always",
        "Honestly, kind of exciting",
        "Like time would go by too fast"
      ]
    },
    {
      text: "Do you think some connections just feel different from the rest — the way this one does?",
      type: "choice",
      options: [
        "Maybe",
        "I think so, honestly",
        "Yes — and I've noticed it with us"
      ]
    },
    {
      text: "What's something you appreciate about me that you've never actually told me?",
      type: "text",
      placeholder: "This one can be small or big..."
    },
    {
      text: "Be honest — does any part of you wonder if this might be more than \u201cjust friends\u201d?",
      type: "choice",
      options: ["Not really", "Maybe, sometimes", "More than I usually admit"]
    },
    {
      text: "Last one. If there's one thing you'd want me to know right now, what would it be?",
      type: "text",
      placeholder: "Whatever comes to mind is enough..."
    }
  ];

  var answers = {};
  var stage = document.getElementById('stage');
  var conSvg = document.getElementById('conSvg');
  var revealEl = document.querySelector('.reveal[data-step="final"]');
  revealEl.parentNode.removeChild(revealEl); // detach so stage.innerHTML resets never destroy it

  var conPts = [];

  function buildConstellation(n){
    conSvg.innerHTML = '';
    var w = 400, h = 100;
    conSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    conSvg.setAttribute('preserveAspectRatio', 'none');
    conPts = [];
    var i, t, x, y;
    for (i = 0; i < n; i++){
      t = n > 1 ? i / (n - 1) : 0;
      x = 14 + t * (w - 28);
      y = h * 0.78 - Math.sin(t * Math.PI * 1.35) * 26 - t * 26;
      conPts.push({ x: x, y: y });
    }
    for (i = 1; i < n; i++){
      var dx = conPts[i].x - conPts[i-1].x;
      var dy = conPts[i].y - conPts[i-1].y;
      var len = Math.sqrt(dx*dx + dy*dy);
      var line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', conPts[i-1].x);
      line.setAttribute('y1', conPts[i-1].y);
      line.setAttribute('x2', conPts[i].x);
      line.setAttribute('y2', conPts[i].y);
      line.setAttribute('class', 'cline');
      line.setAttribute('id', 'cline-' + i);
      line.style.strokeDasharray = len;
      line.style.strokeDashoffset = len;
      conSvg.appendChild(line);
    }
    for (i = 0; i < n; i++){
      var c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', conPts[i].x);
      c.setAttribute('cy', conPts[i].y);
      c.setAttribute('r', i === n - 1 ? 5.5 : 3);
      c.setAttribute('class', 'cstar' + (i === n - 1 ? ' north' : ''));
      c.setAttribute('id', 'cstar-' + i);
      conSvg.appendChild(c);
    }
  }
  buildConstellation(questions.length);

  function updateConstellation(answeredCount){
    for (var i = 0; i < answeredCount; i++){
      var star = document.getElementById('cstar-' + i);
      if (star) star.classList.add('lit');
      if (i > 0){
        var line = document.getElementById('cline-' + i);
        if (line && !line.classList.contains('lit')){
          line.classList.add('lit');
          line.style.transition = 'stroke-dashoffset 1s ease, stroke .5s ease';
          line.style.stroke = 'rgba(244,201,120,0.55)';
          window.requestAnimationFrame(function(l){
            return function(){ l.style.strokeDashoffset = '0'; };
          }(line));
        }
      }
    }
  }

  function escapeText(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderQuestion(index){
    stage.innerHTML = '';
    var q = questions[index];

    var wrap = document.createElement('div');
    wrap.className = 'qcard active';

    var num = document.createElement('div');
    num.className = 'qnum';
    num.textContent = 'Question ' + (index + 1) + ' of ' + questions.length;
    wrap.appendChild(num);

    var qt = document.createElement('div');
    qt.className = 'qtext';
    qt.textContent = q.text;
    wrap.appendChild(qt);

    if (q.type === 'choice'){
      var optWrap = document.createElement('div');
      optWrap.className = 'options';
      q.options.forEach(function(optText){
        var btn = document.createElement('button');
        btn.className = 'opt';
        btn.type = 'button';
        btn.textContent = optText;
        btn.addEventListener('click', function(text){
          return function(){ recordAnswer(index, text); };
        }(optText));
        optWrap.appendChild(btn);
      });
      wrap.appendChild(optWrap);
    } else {
      var ta = document.createElement('textarea');
      ta.placeholder = q.placeholder || '';
      wrap.appendChild(ta);

      var goBtn = document.createElement('button');
      goBtn.className = 'go';
      goBtn.type = 'button';
      goBtn.textContent = 'Continue \u2192';
      goBtn.addEventListener('click', function(){
        var val = ta.value.trim();
        recordAnswer(index, val.length ? val : '(left blank)');
      });
      wrap.appendChild(goBtn);
    }

    stage.appendChild(wrap);
    updateConstellation(index);
  }

  function recordAnswer(index, value){
    answers['q' + (index + 1)] = value;
    var next = index + 1;
    if (next < questions.length){
      renderQuestion(next);
    } else {
      updateConstellation(questions.length);
      finish();
    }
  }

  // ignite star -> start questions
  document.getElementById('ignite').addEventListener('click', function(){
    var el = this;
    if (el.classList.contains('lit')) return;
    el.classList.add('lit');
    setTimeout(function(){ renderQuestion(0); }, 550);
  });

  function typeWriter(el, text, speed, cb){
    el.textContent = '';
    el.classList.remove('done');
    var i = 0;
    (function step(){
      if (i <= text.length){
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(step, speed);
      } else {
        el.classList.add('done');
        if (cb) cb();
      }
    })();
  }

  function finish(){
    var e3 = answers.q3 && answers.q3 !== '(left blank)' ? answers.q3 : null;
    var e6 = answers.q6 && answers.q6 !== '(left blank)' ? answers.q6 : null;
    var e8 = answers.q8 && answers.q8 !== '(left blank)' ? answers.q8 : null;
    var e11 = answers.q11 && answers.q11 !== '(left blank)' ? answers.q11 : null;
    var e13 = answers.q13 && answers.q13 !== '(left blank)' ? answers.q13 : null;

    var lines = [];

    lines.push("I don't say things like this very often, so I want to say this one clearly: you make ordinary days feel a little more lit up, just by being around. That's not a small thing to me.");

    if (e3){
      lines.push('You told me <span class="echo">\u201c' + escapeText(e3) + '\u201d</span> \u2014 and reading that, honestly, it made me sit with a smile longer than I expected.');
    } else {
      lines.push("There are things about talking to you that I look forward to more than I usually let on.");
    }

    if (e6){
      lines.push('You also mentioned something you\u2019d never brought up before: <span class="echo">\u201c' + escapeText(e6) + '\u201d</span> \u2014 I\u2019m glad you finally said it.');
    }

    if (e8){
      lines.push('You picked <span class="echo">\u201c' + escapeText(e8) + '\u201d</span> as the word for how you feel around me \u2014 and if I\u2019m honest, that\u2019s close to the word I\u2019d have picked too.');
    } else {
      lines.push("The way I feel around you isn't something I can fully put into one word either.");
    }

    if (e11){
      lines.push('You said <span class="echo">\u201c' + escapeText(e11) + '\u201d</span> \u2014 I don\u2019t think you know how much that meant to hear.');
    }

    if (e13){
      lines.push('And the one thing you wanted me to know \u2014 <span class="echo">\u201c' + escapeText(e13) + '\u201d</span> \u2014 I heard it, and I\u2019m holding onto it.');
    } else {
      lines.push("I don't need you to have this all figured out right now. Take whatever time you need.");
    }

    lines.push("I don't need an answer tonight, or maybe ever. I just wanted you to know that out of everyone in my sky, you're one of the brightest \u2014 and I'd notice if you weren't there.");

    stage.innerHTML = '';
    revealEl.classList.add('active');
    stage.appendChild(revealEl);
    bindReactButton();

    var ds = document.getElementById('datestamp');
    var today = new Date();
    ds.textContent = today.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

    var tw = document.getElementById('typewriter');
    var box = document.getElementById('letterBox');
    box.innerHTML = '';

    typeWriter(tw, 'Dear Laiba,', 55, function(){
      lines.forEach(function(html, i){
        var p = document.createElement('p');
        p.innerHTML = html;
        box.appendChild(p);
        setTimeout(function(){ p.classList.add('show'); }, i * 650);
      });

      var signoff = document.getElementById('signoff');
      var reactWrap = document.getElementById('reactWrap');
      setTimeout(function(){ signoff.classList.add('show'); }, lines.length * 650 + 300);
      setTimeout(function(){ reactWrap.classList.add('show'); }, lines.length * 650 + 900);
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
    saveResponse();
  }

  // reaction button with a little particle burst
  var reactBtnBound = false;
  function bindReactButton(){
    if (reactBtnBound) return;
    var btn = document.getElementById('reactBtn');
    if (!btn) return;
    reactBtnBound = true;
    btn.addEventListener('click', function(e){
      var b2 = e.currentTarget;
      if (!b2.classList.contains('reacted')){
        b2.classList.add('reacted');
        b2.textContent = '\ud83d\udc9b she felt it';
        saveReaction();
      }
      for (var i = 0; i < 10; i++){
        var b = document.createElement('span');
        b.className = 'burst';
        b.textContent = Math.random() > 0.5 ? '\u2726' : '\u2661';
        var angle = Math.random() * Math.PI * 2;
        var dist = 30 + Math.random() * 40;
        b.style.setProperty('--bx', Math.cos(angle) * dist + 'px');
        b.style.setProperty('--by', Math.sin(angle) * dist + 'px');
        b.style.left = '50%';
        b.style.top = '0';
        b2.appendChild(b);
        (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1000); })(b);
      }
    });
  }

  var FORMSPREE_ENDPOINT = 'https://formspree.io/f/mgawylvq';

  function saveResponse(){
    // Primary: email the answers via Formspree so they land in your inbox.
    try{
      var payload = { timestamp: new Date().toISOString() };
      questions.forEach(function(q, i){
        var key = 'q' + (i + 1);
        payload[key + '_question'] = q.text;
        payload[key + '_answer'] = answers[key] || '';
      });
      fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(function(){});
    }catch(e){}

    // Fallback: also save via window.storage if available (e.g. inside an artifact preview).
    if (!window.storage || !window.storage.set) return;
    try{
      var record = { answers: answers, timestamp: new Date().toISOString() };
      window.storage.set('response:' + Date.now(), JSON.stringify(record), true).catch(function(){});
    }catch(e){}
  }

  function saveReaction(){
    if (!window.storage || !window.storage.set) return;
    try{
      window.storage.set('reaction:' + Date.now(), JSON.stringify({ liked: true, timestamp: new Date().toISOString() }), true).catch(function(){});
    }catch(e){}
  }

  function showResults(){
    var main = document.getElementById('mainCard');
    main.innerHTML = '<div class="eyebrow">saved responses</div><h1 style="margin-bottom:20px;">What Laiba answered</h1><div id="resultsList">Loading\u2026</div>';
    if (!window.storage || !window.storage.list){
      document.getElementById('resultsList').innerHTML = '<p style="color:var(--muted);">Storage is not available here.</p>';
      return;
    }
    window.storage.list('response:', true).then(function(list){
      var keys = (list && list.keys) ? list.keys.slice() : [];
      if (keys.length === 0){
        document.getElementById('resultsList').innerHTML = '<p style="color:var(--muted);">No responses saved yet.</p>';
        return;
      }
      keys.sort().reverse();
      var chain = Promise.resolve();
      var html = '';
      keys.forEach(function(k){
        chain = chain.then(function(){
          return window.storage.get(k, true).then(function(res){
            if (!res) return;
            var data = JSON.parse(res.value);
            html += '<div class="results-card"><div class="t">' + new Date(data.timestamp).toLocaleString() + '</div>';
            Object.keys(data.answers).forEach(function(qk){
              html += '<div class="entry"><div class="q">' + qk + '</div><div class="a">' + escapeText(data.answers[qk]) + '</div></div>';
            });
            html += '</div>';
          }).catch(function(){});
        });
      });
      chain.then(function(){
        document.getElementById('resultsList').innerHTML = html || '<p style="color:var(--muted);">No responses saved yet.</p>';
      });
    }).catch(function(){
      document.getElementById('resultsList').innerHTML = '<p style="color:var(--muted);">Could not load responses.</p>';
    });
  }

  if (window.location.search.indexOf('results') !== -1){
    showResults();
  }

  // ambient sky: twinkling stars + occasional shooting stars
  function spawnTwinkles(container, count){
    for (var i = 0; i < count; i++){
      var s = document.createElement('div');
      s.className = 'twinkle';
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.top = (Math.random() * 100) + 'vh';
      s.style.animationDuration = (2.5 + Math.random() * 3) + 's';
      s.style.animationDelay = (Math.random() * 4) + 's';
      var size = Math.random() > 0.85 ? 3 : 2;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      container.appendChild(s);
    }
  }
  spawnTwinkles(document.getElementById('sky'), 70);

  function spawnShootingStar(container){
    var s = document.createElement('div');
    s.className = 'shooting';
    s.style.top = (Math.random() * 40) + 'vh';
    s.style.left = (60 + Math.random() * 35) + 'vw';
    container.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 1500);
  }
  var skyEl = document.getElementById('sky');
  setInterval(function(){
    if (Math.random() < 0.6) spawnShootingStar(skyEl);
  }, 5000);

})();
</script>
